<!DOCTYPE html><html lang="zh-HK"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>港鐵小達人 MTR</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#111;touch-action:none;font-family:"PingFang HK","Noto Sans TC",sans-serif}
canvas{display:block;touch-action:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,20,40,.82);color:#fff;text-align:center;z-index:10}
.hide{display:none!important}
.big{font-size:64px;margin:6px}
h1{font-size:44px;margin:8px}
.btn{font-size:30px;padding:14px 36px;border:0;border-radius:40px;background:#e2231a;color:#fff;margin:10px;box-shadow:0 6px 0 #8a120c;cursor:pointer}
#hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:24px;padding:8px 22px;font-size:26px;z-index:5;white-space:nowrap;box-shadow:0 3px 10px #0005}
#steps{position:fixed;top:10px;left:10px;font-size:26px;z-index:5;background:#0007;border-radius:14px;padding:4px 10px;color:#fff}
#act{position:fixed;right:28px;bottom:40px;width:120px;height:120px;border-radius:50%;border:0;background:#ffcc00;font-size:54px;z-index:6;box-shadow:0 6px 0 #a80;opacity:.45}
#act.on{opacity:1;animation:pul .8s infinite}
@keyframes pul{50%{transform:scale(1.1)}}
#joy{position:fixed;width:130px;height:130px;border-radius:50%;background:#fff3;border:3px solid #fff8;z-index:6;display:none;pointer-events:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#fffc}
#toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:80px;z-index:8;pointer-events:none;transition:.3s;opacity:0}
#cross{position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff;z-index:4;opacity:.7}
#map .line{display:flex;align-items:center;gap:0;margin:20px;background:#fff;padding:30px 20px;border-radius:20px}
.st{display:flex;flex-direction:column;align-items:center;color:#222;font-size:22px;cursor:pointer;width:96px}
.dot{width:42px;height:42px;border-radius:50%;background:#fff;border:8px solid #0075c2;margin:6px;font-size:22px;line-height:26px}
.bar{height:10px;background:#0075c2;width:30px;margin-top:-34px}
.stars{font-size:70px}
.sum{font-size:24px;line-height:1.7;background:#fff2;border-radius:16px;padding:10px 20px;max-width:640px}
</style></head><body>
<div id="hud">🚇</div><div id="steps"></div><div id="cross"></div>
<button id="act">✋</button><div id="joy"><div id="knob"></div></div><div id="toast"></div>
<div id="title" class="ov"><div class="big">🚇🎫👵🗺️</div><h1>港鐵小達人</h1><div style="font-size:24px">輪與翼 · 乘搭港鐵</div>
<div style="font-size:22px;margin:10px">🕹️ 左邊推動行走 · 👆 右邊拖動轉身 · ✋ 互動<br>💻 WASD 行走 · 滑鼠拖動 · E / 空白鍵</div><button class="btn" id="go">▶ 開始</button></div>
<div id="map" class="ov hide"><div class="big">🗺️ 去 🛍️ 銅鑼灣</div><div class="line" id="line"></div><div style="font-size:22px">👆 揀車站落車</div></div>
<div id="end" class="ov hide"><h1>🎉 完成！</h1><div class="stars" id="stars"></div>
<div class="sum">🎫 拍八達通入閘<br>🟨 企喺黃線後 · 先落後上<br>👵 讓座 · ✊ 捉緊扶手<br>🗺️ 睇路線圖 · 準時落車<br>⚡ 港鐵：快、準時、載客多、用電 🌱 減少污染</div>
<button class="btn" onclick="location.reload()">🔁 再玩</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
['gesturestart','gesturechange','dblclick'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
const touch=matchMedia('(pointer:coarse)').matches;
const R=new THREE.WebGLRenderer({antialias:!touch});R.setPixelRatio(Math.min(devicePixelRatio,touch?1.3:2));
R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=!touch;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x1a1f2a);S.fog=new THREE.Fog(0x1a1f2a,25,60);
const C=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,100);
addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
S.add(new THREE.HemisphereLight(0xffffff,0x445566,1.1));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(5,10,4);S.add(dl);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.6});
function box(w,h,d,c,x,y,z,p=S){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c=='number'?M(c):c);m.position.set(x,y,z);p.add(m);return m}
function sprite(txt,size,bg,fg='#fff',w=256){const cv=document.createElement('canvas');cv.width=w;cv.height=128;const g=cv.getContext('2d');
 if(bg){g.fillStyle=bg;g.fillRect(0,0,w,128)}g.fillStyle=fg;g.font='bold 80px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,w/2,68);
 const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t}));s.scale.set(size*w/128,size,1);return s}
// station group
const st=new THREE.Group();S.add(st);
box(16,.2,34,0xd8d4cc,1,-.1,4,st); // floor
box(16,.2,34,0xeeeeee,1,4.1,4,st); // ceiling
for(let z=-12;z<=20;z+=4)box(.2,.05,2.5,new THREE.MeshBasicMaterial({color:0xffffff}),1,4,z,st);
box(.3,4.2,34,0x9fb8c8,9,2,4,st); box(16,4.2,.3,0x9fb8c8,1,2,21,st);
box(1.2,.02,22,0xffd400,-3.2,.01,-1,st); // yellow strip
box(3,.2,34,0x333333,-7,-1.3,4,st); // track bed
for(let z=-14;z<22;z+=1)box(2.6,.1,.2,0x5a4a3a,-7,-1.15,z,st);
box(.1,.1,34,0x999999,-6.3,-1.05,4,st);box(.1,.1,34,0x999999,-7.7,-1.05,4,st);
box(.3,5,34,0x2a2f38,-9.6,1.5,4,st);
// screen doors line x=-4
const psd=[];
for(let z=-11;z<=9;z+=4){ if(Math.abs(z-1)<.1||true){}
 const glass=new THREE.MeshStandardMaterial({color:0x99ccee,transparent:true,opacity:.35});
 box(.15,2.4,1.8,glass,-4,1.2,z-1.1,st);box(.15,2.4,1.8,glass,-4,1.2,z+2.9,st);
 box(.3,.5,4,0x333a44,-4,2.65,z+.9,st);}
const dl1=box(.12,2.3,.9,new THREE.MeshStandardMaterial({color:0x99ccee,transparent:true,opacity:.5}),-4,1.15,-.45,st);
const dl2=box(.12,2.3,.9,new THREE.MeshStandardMaterial({color:0x99ccee,transparent:true,opacity:.5}),-4,1.15,.45,st);
box(.2,.1,1.8,0x22cc44,-4,2.45,0,st);
// waiting arrows boxes
const waitMat=new THREE.MeshBasicMaterial({color:0x22cc44,transparent:true,opacity:.6});
const wb1=box(1,.03,1,waitMat,-3,.03,-1.6,st),wb2=box(1,.03,1,waitMat,-3,.03,1.6,st);
const red=new THREE.MeshBasicMaterial({color:0xff3030,transparent:true,opacity:.45});box(1,.03,1.2,red,-3,.035,0,st);
// signs
const s1=sprite('港島綫 Island Line',.5,'#0075c2','#fff',512);s1.position.set(-3.9,3.4,4);st.add(s1);
const s2=sprite('🚇 往月台 ⬆',.5,'#e2231a','#fff',384);s2.position.set(1,3.4,14);st.add(s2);
const s3=sprite('🛑 先落後上',.45,'#ffd400','#222',384);s3.position.set(-3.9,3.0,0);st.add(s3);
for(let z=-10;z<20;z+=6){box(.5,4,.5,0xc0392b,4,2,z,st)}
// gates z=12
box(5,1.1,.6,0x666e78,-3.5,.55,12,st);box(5,1.1,.6,0x666e78,4.5,.55,12,st);
box(.5,1.1,1.6,0x777,-.8,.55,12,st);box(.5,1.1,1.6,0x777,.8,.55,12,st);
const reader=box(.4,.06,.4,new THREE.MeshStandardMaterial({color:0xffcc00,emissive:0x664400}),.8,1.13,12.4,st);
const flap1=box(.5,.6,.08,0xe2231a,-.35,.8,12,st),flap2=box(.5,.6,.08,0xe2231a,.35,.8,12,st);
const oct=sprite('🎫',.4);oct.position.set(.8,1.5,12.4);st.add(oct);
// people
function person(col,emo){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.9,4,8),M(col));b.position.y=.75;g.add(b);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.2,12,12),M(0xf1c9a5));h.position.y=1.5;g.add(h);if(emo){const s=sprite(emo,.45);s.position.y=2.05;g.add(s)}return g}
const crowd=[];[[3,0x3366aa,2],[6,0x55aa55,-6],[2,0xaa5533,-9],[6.5,0x884488,8]].forEach(([x,c,z])=>{const p=person(c);p.position.set(x,0,z);st.add(p);crowd.push(p)});
// train
const tr=new THREE.Group();S.add(tr);
const silver=new THREE.MeshStandardMaterial({color:0xcfd4da,metalness:.6,roughness:.35});
box(3,.15,20,0xb0b4b8,-7,0,0,tr);box(3,.15,20,silver,-7,2.6,0,tr);box(.1,2.6,20,silver,-8.5,1.3,0,tr);
box(.1,2.6,9.2,silver,-5.5,1.3,-5.4,tr);box(.1,2.6,9.2,silver,-5.5,1.3,5.4,tr);box(.1,.4,1.6,silver,-5.5,2.4,0,tr);
box(.12,.18,20,0xe2231a,-5.45,1.0,0,tr);box(.12,.18,20,0xe2231a,-8.55,1.0,0,tr);
const tw=new THREE.MeshStandardMaterial({color:0x223344,transparent:true,opacity:.6});
for(let z=-8;z<=8;z+=3){if(Math.abs(z)>1)box(.12,.8,1.6,tw,-5.43,1.7,z,tr)}
const td1=box(.1,2.2,.8,silver,-5.42,1.1,-.4,tr),td2=box(.1,2.2,.8,silver,-5.42,1.1,.4,tr);
box(3,2.8,.1,0xe2231a,-7,1.3,-10,tr);box(3,2.8,.1,0xe2231a,-7,1.3,10,tr);
for(let z of[-6,-3,3,6])box(.6,.45,2.4,0xd0403a,-8.1,.3,z,tr);
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,2.6),new THREE.MeshStandardMaterial({color:0xffcc00,metalness:.8}));pole.position.set(-6.6,1.3,2.2);tr.add(pole);
const poleS=sprite('✊',.4);poleS.position.set(-6.6,2.2,2.2);tr.add(poleS);poleS.visible=false;
for(let z=-9;z<10;z+=2.5){const l=box(.6,.04,1.5,new THREE.MeshBasicMaterial({color:0xffffff}),-7,2.5,z,tr)}
const exiters=[0xaa3333,0x3399aa,0x557733].map((c,i)=>{const p=person(c);p.position.set(-7,0,-1+i);tr.add(p);return p});
const granny=person(0x9966cc,'👵');granny.position.set(-6.4,0,-4);tr.add(granny);granny.visible=false;
const seatS=sprite('💺',.4);seatS.position.set(-8.1,1,-3);tr.add(seatS);
tr.position.z=-40;
// controls
const P={x:1,z:18,yaw:0,pitch:0};let keys={},mv={x:0,y:0};
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='KeyE'||e.code=='Space')act()});addEventListener('keyup',e=>keys[e.code]=0);
let jid=null,jc=null,lid=null,lp=null;
R.domElement.addEventListener('pointerdown',e=>{if(e.pointerType!='mouse'&&e.clientX<innerWidth/2&&jid==null){jid=e.pointerId;jc=[e.clientX,e.clientY];const j=$('joy');j.style.display='block';j.style.left=jc[0]-65+'px';j.style.top=jc[1]-65+'px'}else if(lid==null){lid=e.pointerId;lp=[e.clientX,e.clientY]}});
addEventListener('pointermove',e=>{if(e.pointerId===jid){let dx=e.clientX-jc[0],dy=e.clientY-jc[1],d=Math.hypot(dx,dy),k=Math.min(d,50)/(d||1);dx*=k;dy*=k;mv={x:dx/50,y:dy/50};$('knob').style.transform=`translate(${dx}px,${dy}px)`}
 else if(e.pointerId===lid){P.yaw-=(e.clientX-lp[0])*.006;P.pitch=Math.max(-1,Math.min(1,P.pitch-(e.clientY-lp[1])*.004));lp=[e.clientX,e.clientY]}});
const up=e=>{if(e.pointerId===jid){jid=null;mv={x:0,y:0};$('joy').style.display='none';$('knob').style.transform=''}if(e.pointerId===lid)lid=null};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
$('act').addEventListener('pointerdown',e=>{e.stopPropagation();act()});
// game state
let phase=-1,mistakes=0,eye=1.5,t0=0,canAct=null;
const hud=t=>$('hud').textContent=t;
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1100)}
const steps=()=>$('steps').textContent=['🎫','🟨','👵','🗺️'].map((s,i)=>i<task?'✅':i==task?s:'⬜').join(' ');
let task=0;
$('go').onclick=()=>{$('title').classList.add('hide');phase=0;steps();hud('🎫 行去閘口 拍八達通')};
const sounds=new (window.AudioContext||window.webkitAudioContext)();
function beep(f=880,d=.12){try{sounds.resume();const o=sounds.createOscillator(),g=sounds.createGain();o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(sounds.destination);o.start();o.stop(sounds.currentTime+d)}catch(e){}}
let gateOpen=0,trainState=0,tt=0,ex=0,doorsOpen=0,ox=0,seated=0;
function act(){if(!canAct){toast('🤔');return}canAct()}
const near=(x,z,r)=>Math.hypot(P.x-x,P.z-(z))<r;
function update(dt){
 // movement
 let f=-(mv.y)+((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0),s=mv.x+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0);
 if(keys.ArrowLeft&&!keys.KeyA){}
 if(seated||phase<0)f=s=0;
 const sp=3*dt,sx=Math.sin(P.yaw),cz=Math.cos(P.yaw);
 let nx=P.x+(-sx*f+cz*s)*sp,nz=P.z+(-cz*f-sx*s)*sp;
 if(phase<=1){ nx=Math.max(phase==1&&doorsOpen&&ex>=3&&Math.abs(nz)<.7?-7:-3.6,Math.min(8.5,nx));nz=Math.max(-12,Math.min(20.5,nz));
  if(!gateOpen&&nz<12.6)nz=12.6; if(gateOpen&&Math.abs(nz-12)<.6&&Math.abs(nx)>.4)nx=Math.max(-.4,Math.min(.4,nx));
  if(nx<-3.6&&Math.abs(nz)>.7)nx=-3.6;}
 else if(phase==2){nx=Math.max(-8.1,Math.min(-5.8,nx));nz=Math.max(-9.5,Math.min(9.5,nz))}
 P.x=nx;P.z=nz;canAct=null;$('act').classList.remove('on');
 // tasks
 if(phase==0){oct.position.y=1.5+Math.sin(performance.now()/200)*.1;
  if(!gateOpen&&near(.8,12.6,1.4)){canAct=()=>{beep(1200);gateOpen=1;toast('✅🎫');flap1.position.x=-.7;flap2.position.x=.7;oct.visible=false;hud('🟨 去綠色位 等車')}}
  if(gateOpen&&P.z<11){phase=1;task=1;steps()}}
 if(phase==1){
  const inWait=P.x>-3.6&&P.x<-2.4&&(Math.abs(P.z-1.6)<.6||Math.abs(P.z+1.6)<.6);
  waitMat.opacity=.4+Math.sin(performance.now()/150)*.3;
  if(trainState==0&&inWait){trainState=1;tt=0;hud('🚇 列車到站… 等一等');toast('👍')}
  if(trainState==1){tt+=dt;const k=Math.min(1,tt/4);tr.position.z=-40*(1-k)*(1-k);if(k>=1){trainState=2;tt=0;beep(660,.3)}}
  if(trainState==2){tt+=dt;const o=Math.min(1,tt);dl1.position.z=-.45-o*.85;dl2.position.z=.45+o*.85;td1.position.z=-.4-o*.8;td2.position.z=.4+o*.8;
   if(o>=1){trainState=3;doorsOpen=1;hud('🛑 先落後上')}}
  if(trainState==3&&ex<3){const p=exiters[ex];p.position.z+=(0-p.position.z)*.2;p.position.x+=dt*4.5;
   if(p.position.x>-3.5&&Math.abs(P.z)<.7&&P.x<-1.5&&!p.bump){p.bump=1;mistakes++;toast('⚠️ 讓開！')}
   if(p.position.x>2){p.visible=false;ex++;if(ex==3){hud('🚪 而家上車！')}}}
  if(trainState==3&&P.x<-5.6){phase=2;task=2;steps();granny.visible=true;hud('👵 讓座俾婆婆');
   P.x=-7.6;P.z=-3;P.yaw=-0.9;seated=1;doorsOpen=0;trainState=4;tt=0}}
 if(phase==2){
  if(trainState==4){tt+=dt;const o=Math.max(0,1-tt);td1.position.z=-.4-o*.8;td2.position.z=.4+o*.8;dl1.position.z=-.45-o*.85;dl2.position.z=.45+o*.85;if(tt>1.2){trainState=5}}
  if(trainState==5){st.position.z+=dt*Math.min(12,(st.position.z+1)*2);if(st.position.z>60)st.visible=false;}
  if(seated==1){eye=1.05;canAct=()=>{seated=0;eye=1.5;beep(1000);toast('👵❤️');granny.userData.go=1;hud('✊ 捉緊扶手');poleS.visible=true}}
  if(granny.userData.go){granny.position.x+=(-7.9-granny.position.x)*.05;granny.position.z+=(-3-granny.position.z)*.05;granny.children[0].scale.y=.75}
  if(!seated&&poleS.visible&&near(-6.6,2.2,1.1)){canAct=()=>{poleS.visible=false;beep(1200);toast('✊✅');task=3;steps();phase=3;setTimeout(showMap,900)}}
  if(!seated&&poleS.visible&&!granny.userData.hint){tt+=0}
  if(poleS.visible)poleS.position.y=2.2+Math.sin(performance.now()/200)*.1;
 }
 if(phase==3&&st.visible){st.position.z+=dt*12}
 if(phase>=2){C.position.x+=Math.sin(performance.now()/90)*.005}
 if(canAct)$('act').classList.add('on');
 C.position.set(P.x+(phase>=2?Math.sin(performance.now()/90)*.01:0),eye+(phase>=2?Math.sin(performance.now()/70)*.008:0),P.z+(phase>=2?tr.position.z:0));
 C.rotation.set(P.pitch,P.yaw,0,'YXZ');
 crowd.forEach((p,i)=>p.rotation.y=Math.sin(performance.now()/800+i));
}
const stations=[['上環','⛵'],['中環','🏦'],['金鐘','🏛️'],['灣仔','🏟️'],['銅鑼灣','🛍️'],['天后','⛩️']];
function showMap(){hud('🗺️');const L=$('line');stations.forEach(([n,e],i)=>{if(i)L.insertAdjacentHTML('beforeend','<div class="bar"></div>');
 const d=document.createElement('div');d.className='st';d.innerHTML=`<div class="dot">${i==0?'🚇':''}</div><div style="font-size:30px">${e}</div>${n}`;
 d.onpointerdown=()=>{if(i==4){beep(1300,.3);d.querySelector('.dot').textContent='⭐';setTimeout(finish,700)}else{mistakes++;beep(200,.2);d.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],300)}};L.appendChild(d)});
 $('map').classList.remove('hide')}
function finish(){$('map').classList.add('hide');task=4;steps();$('stars').textContent='⭐'.repeat(Math.max(1,3-Math.floor(mistakes/1.5)))+'☆'.repeat(3-Math.max(1,3-Math.floor(mistakes/1.5)));$('end').classList.remove('hide')}
window.__dbg={P,get phase(){return phase},act,showMap,finish};
let last=performance.now();R.setAnimationLoop(()=>{const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;update(dt);R.render(S,C)});
</script></body></html>
