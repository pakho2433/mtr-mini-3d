 let nx=P.x+(-sx*f+cz*s)*sp,nz=P.z+(-cz*f-sx*s)*sp;
 const moving=Math.abs(f)+Math.abs(s)>.1;
 if(phase<=1){const boardOK=phase==1&&trainState==3&&ex>=3&&DOORS.some(d=>Math.abs(nz-d)<.6);
  nx=Math.min(8.6,Math.max(boardOK?-6.5:-3.65,nx));nz=Math.max(-13.5,Math.min(21,nz));
  if(Math.abs(nz-12)<.95&&!(gateOpen&&Math.abs(nx)<.45)){nz=P.z>=12?Math.max(nz,12.95):Math.min(nz,11.05)}
  if(Math.abs(nx-4.2)<.55&&[-9,-3,3,9,15].some(z=>Math.abs(nz-z)<.55)){nx=P.x;nz=P.z}}
 else if(phase>=2){nx=Math.max(-7.6,Math.min(-6.4,nx));nz=Math.max(-9.3,Math.min(9.3,nz))}
 P.x=nx;P.z=nz;canAct=null;
 // phase 0
 if(phase==0){octo.position.y=1.45+Math.sin(T*4)*.06;
  if(!gateOpen&&near(.85,12.9,1.3))canAct=()=>{if(bal<12){sfx.bad();setLed(0xff2222);toast('❌ 💰$'+bal);hud('🏧 錢唔夠！去增值');avmS.visible=true;needTop=1}
   else{bal-=12;sfx.beep();sfx.ok();gateOpen=1;setLed(0x22ff55);toast('✅ $'+bal);hud('🟨 去月台 · 企綠色箭咀');flaps.forEach(f=>{if(Math.abs(f.parent.position.x+.85)<.1||Math.abs(f.parent.position.x-.85)<.1)f.userData.open=1});octo.visible=false}};
  if(needTop&&bal<12&&near(8,17,1.4))canAct=()=>{$('fare').classList.remove('hide')};
  if(avmS.visible)avmS.position.y=2.2+Math.sin(T*4)*.08;
  if(gateOpen&&P.z<11){phase=1;task=1;steps()}}
 flaps.forEach(fl=>{if(fl.userData.open){fl.rotation.y+=(Math.PI/2-fl.rotation.y)*.15}});
 // phase 1
 if(phase==1){glowBox.forEach(g=>g.material.opacity=.25+Math.sin(T*5)*.2);
  const inWait=P.x>-3.2&&P.x<-1.9&&Math.abs(Math.abs(P.z)-1.4)<.6;
  if(trainState==0&&inWait){trainState=1;tt=0;hud('🚇 列車到站…');toast('👍');sfx.arrive();say(['arrive'],1.4);rumble(.9);glowBox.forEach(g=>g.visible=false)}
  if(trainState==1){tt+=dt;const k=Math.min(1,tt/5);tr.position.z=-70*Math.pow(1-k,3);if(k>=1){trainState=2;tt=0;rumble(.15);psdLeds.forEach(l=>l.material.color.set(0x22ff55))}}
  if(trainState==2){tt+=dt;const o=Math.min(1,tt/1.2);doorsSet(o);if(o>=1){trainState=3;hud('🚪 先落後上 · 等等')}}
  if(trainState==3&&ex<3){const p=exiters[ex];p.userData.t=(p.userData.t||0)+dt;const t=p.userData.t;walkAnim(p,t);
   if(p.position.x<-4.5){p.position.z+=(0-p.position.z)*.1;p.position.x+=dt*2.6}else{p.position.x+=dt*1.6;p.position.z+=dt*(ex==1?-2:2);p.rotation.y=Math.atan2(1.6,ex==1?-2:2)}
   if(p.position.x>-4.3&&p.position.x<-1&&Math.abs(P.z-p.position.z)<.6&&P.x<-1&&!p.userData.bump){p.userData.bump=1;mistakes++;sfx.bad();toast('⚠️ 讓開！')}
   if(t>3.6){p.visible=false;ex++;if(ex==3)hud('✅ 而家上車！')}
   if(p.position.x>-4)tr.remove(p)||st.attach(p)}
  if(trainState==3&&P.x<-5.4){phase=2;task=2;steps();granny.visible=true;hud('👵 讓座！');sfx.door();say(['door_zh','door_en'],1.7);
   P.x=-7.85;P.z=-3;P.yaw=-1.0;P.pitch=-.1;seated=1;trainState=4;tt=0;psdLeds.forEach(l=>l.material.color.set(0xff2020))}}
 // phase 2
 if(phase==2||phase==3){
  if(trainState==4){tt+=dt;doorsSet(Math.max(0,1-tt/1.4))}
  if(seated==1){eye=1.05;canAct=()=>{seated=0;eye=1.45;sfx.ok();toast('👵 ❤️');granny.userData.go=1;hud('✊ 捉緊扶手');poleS.visible=true;P.x=-7.3}}
  if(granny.userData.go&&!granny.userData.sat){const g=granny;g.userData.t=(g.userData.t||0)+dt;walkAnim(g,g.userData.t,.3);g.position.x+=(-8.12-g.position.x)*.06;g.position.z+=(-3-g.position.z)*.06;
   if(Math.abs(g.position.x+8.12)<.05){g.userData.sat=1;g.rotation.y=Math.PI/2;sit(g);g.userData.up.rotation.x=0;gTag.position.y=1.5}}
  if(poleS.visible){poleS.position.y=2.2+Math.sin(T*4)*.07;hPole.material.emissiveIntensity=.6+Math.sin(T*6)*.4;
   if(!seated&&near(TX,1.5,1.1))canAct=()=>{poleS.visible=false;hPole.material.emissiveIntensity=0;sfx.ok();toast('✊ ✅');task=3;steps();phase=3;speed=0.01;rumble(.6);hud('🔍 搵 ❌ 行為 0/3');say(['next_adm'],2.5)}}
  if(speed>0){speed=Math.min(16,speed+dt*3);st.position.z+=speed*dt;if(st.position.z>40&&st.visible){st.visible=false;tun.visible=true;tr.position.z=0}
   tl.position.z=(tl.position.z+speed*dt)%5;C.position.x+=0;}
 }
 npcs.forEach((p,i)=>{if(p.userData.done)return;if(phase==3)p.userData.tag.scale.setScalar(.36+Math.sin(T*4+i)*.03)});
 // crowd idle
 crowd.forEach((p,i)=>{if(p.userData.walk){p.userData.ph+=dt;const a=p.userData.ph*.4+i;p.position.x=4+Math.cos(a)*3;p.position.z=17+Math.sin(a)*2.2;p.rotation.y=-a;walkAnim(p,p.userData.ph,.5)}else if(!p.userData.sit)p.userData.up.rotation.y=Math.sin(T*.6+i)*.2});
 if(canAct)$('act').classList.add('on');else $('act').classList.remove('on');
 const sway=phase>=3&&speed>0?Math.sin(T*1.7)*.012*speed/16:0;
 const bob=moving&&!seated?Math.sin(T*9)*.025:0;
 C.position.set(P.x+sway,eye+bob,P.z);C.rotation.set(P.pitch,P.yaw,sway*.5,'YXZ');
 // shadow follows player
 sun.position.set(P.x+6,14,P.z+4);sun.target.position.set(P.x,0,P.z-2);
}
function doorsSet(o){psdLeaves.forEach(g=>g.position.z=DOORS[Math.floor(psdLeaves.indexOf(g)/2)]+g.userData.s*(.4+o*.78));tDoors.forEach(d=>d.position.z=d.userData.z0+d.userData.s*o*.76)}
// ---------- ROUTE MAP ----------
const RED=[['旺角',380,40],['油麻地',380,95],['佐敦',380,150],['尖沙咀',380,205],['金鐘',380,300],['中環',250,300]];
const BLUE=[['上環',120,300],['中環',250,300],['金鐘',380,300],['灣仔',480,300],['銅鑼灣',570,300],['天后',665,300]];
let mapStep=0;
function showMap(){hud('🗺️ 路線');rumble(.3);const sv=$('svg');let h='';
 h+=`<polyline points="380,40 380,300 250,300" fill="none" stroke="#e2231a" stroke-width="14" stroke-linejoin="round"/><polyline points="120,318 665,318" fill="none" stroke="#0075c2" stroke-width="14"/>`;
 h+=`<text x="400" y="70" font-size="20" fill="#e2231a">荃灣綫</text><text x="120" y="355" font-size="20" fill="#0075c2">港島綫</text><path id="hl" d="" stroke="#22cc55" stroke-width="8" fill="none" stroke-dasharray="12 8"/>`;
 const all={};[...RED,...BLUE].forEach(([n,x,y])=>{if(all[n])return;all[n]=1;const ic=n=='金鐘'||n=='中環';const yy=ic?309:(BLUE.some(b=>b[0]==n)?318:y);
  h+=`<g class="stn" data-n="${n}"><circle cx="${x}" cy="${yy}" r="${ic?22:16}" fill="#fff" stroke="${ic?'#333':BLUE.some(b=>b[0]==n)?'#0075c2':'#e2231a'}" stroke-width="6"/><circle cx="${x}" cy="${yy}" r="30" fill="transparent"/>
  <text x="${x+(BLUE.some(b=>b[0]==n)||ic?0:30)}" y="${ic?yy+56:BLUE.some(b=>b[0]==n)?yy-34:yy+7}" font-size="22" font-weight="${ic?'bold':'normal'}" text-anchor="${BLUE.some(b=>b[0]==n)||ic?'middle':'start'}" fill="#222">${n}${n=='尖沙咀'?' 🚩':n=='銅鑼灣'?' 🛍️':''}</text></g>`});
 sv.innerHTML=h;sv.querySelectorAll('.stn').forEach(g=>g.onpointerdown=()=>mapTap(g));$('map').classList.remove('hide')}
function mapTap(g){const n=g.dataset.n;const want=mapStep==0?'金鐘':'銅鑼灣';
 if(n==want){sfx.ok();g.querySelector('circle').setAttribute('fill','#7CFC9A');
  if(mapStep==0){mapStep=1;say(['next_cwb'],.3);$('svg').querySelector('#hl').setAttribute('d','M380 205 L380 300');$('maphint').textContent='🔄 轉 港島綫 ➜ ② 喺邊個站落車？'}
  else{$('svg').querySelector('#hl').setAttribute('d','M380 205 L380 300 L570 300');$('maphint').textContent='🎉';setTimeout(finish,1000)}}
 else{mistakes++;sfx.bad();g.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],300)}}
function finish(){$('map').classList.add('hide');task=5;steps();sfx.win();rumble(0);const s=mistakes<=1?3:mistakes<=3?2:1;$('stars').textContent='⭐'.repeat(s)+'☆'.repeat(3-s);$('end').classList.remove('hide')}
window.__dbg={P,get phase(){return phase},act,judge,npcs,showMap,mapTap};
let last=performance.now();R.setAnimationLoop(()=>{const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;update(dt);R.render(S,C)});
</script></body></html>
